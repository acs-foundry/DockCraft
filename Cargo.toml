[workspace]
resolver = "2"
members = [
    "crates/struct-core",
    "crates/pocket-detect",
    "crates/dock-engine",
    "crates/hyde-scorer",
    "crates/pharm-core",
    "crates/prot-prep",
    "crates/dock-viewport",
    "crates/dock-pipeline",
    "apps/dockcraft-cli",
    "apps/dockcraft",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
flate2 = "1.1"
rand = "0.8"
rustix = { version = "1", features = ["fs"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "24"
egui = "0.31"
egui-wgpu = "0.31"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }

[profile.release]
overflow-checks = true
